[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-factory-engineering"
version = "0.1.0"
description = "Cross-layer AI Factory engineering and acceptance toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-factory = "ai_factory_engineering.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_factory_engineering"]
