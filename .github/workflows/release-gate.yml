name: release-gate

# 完整发布验证包含 demo、release contract 与全历史审计；普通 PR 由 test.yml 覆盖。
# 仅在准备发布/冻结证据时显式运行，避免每次代码提交重复消耗 Actions 分钟数。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v0-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record exact revision
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD > .artifacts/revision.txt

      - name: Install fresh clone
        run: make setup

      - name: Run test suite
        run: make test

      - name: Run deterministic demo
        run: make demo

      - name: Verify release contract
        run: make verify-release

      - name: Install pinned history scanner
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "$base/$asset" -o "/tmp/$asset"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          (cd /tmp && grep "  $asset$" gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$asset" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Audit full git history
        run: make audit-history

      - name: Upload deterministic acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.1-release-gate
          path: .artifacts/
          if-no-files-found: warn
